# maritime_spoofing configuration.
# Override any value on the command line, e.g.:
#   python scripts/extract_features.py --config config.yaml --dataset-dir /data/marsim

paths:
  # MARSIM dataset root (contains dataset.json and the pcap files)
  dataset_dir: "dataset/dataset"
  # Per-epoch parquet series (enables sequence models, sliding-window
  # evaluation, and attack injection into real logs).
  epochs_dir: "results/epochs"
  features_csv: "data/marsim_features.csv"
  mana_predictions_csv: "data/mana_predictions.csv"
  results_dir: "results/ml_classifiers_v2"
  # Real vessel logs for the false-positive validation experiment
  real_data_dir: "data/real_nmea"

receivers:
  # MARSIM pcap receiver identification: [ip, udp_sport] -> receiver id
  rx1: ["192.168.0.10", 62996]
  rx2: ["192.168.0.11", 62997]

extraction:
  save_epoch_series: true      # write per-recording parquet (sequence models + injection)
  validate_checksums: false    # MARSIM is clean; real logs validate regardless
  n_workers: 0                 # 0 = os.cpu_count() - 2

features:
  profile: "full"              # "full" (138 features) or "deployable" (GGA+VTG+ZDA only)

preprocessing:
  # Artifact ablation (see scripts/audit_dataset.py): the SNR family is a
  # simulator fingerprint (mean_snr_median is a single-feature PERFECT
  # oracle, AUC 1.0000, on scenarios A1 and A2); GSA features are constant.
  # The journal experiments run artifact-free by default. Set to [] only to
  # reproduce the contaminated CIMSS-era upper bound, and disclose it.
  ablate_families: ["snr", "gsa"]
  zero_variance_eps: 1.0e-10
  nan_col_drop_threshold: 0.5
  skew_threshold: 5.0
  winsorize: true              # set false to match the CIMSS paper text exactly
  winsorize_quantiles: [0.01, 0.99]
  # Iterative mean-abs-correlation removal (matches the paper text; the old
  # greedy upper-triangle rule was a different algorithm and is gone).
  correlation_threshold: 0.95

split:
  regime: "repetition"         # repetition | kfold | param_holdout
  kfold_n: 5
  param_holdout_preset: "a3_speed_low"   # see mspoof.splits.PARAM_HOLDOUT_PRESETS

models:
  tier: "default"              # default | adjusted | both
  svm:
    enabled: true
    train_on_full_set: true    # false reproduces the old 10k subsample (must be disclosed)
    subsample_size: 10000
    # probability=true adds a hidden 5-fold Platt refit (hours on the full
    # set). Leave false; AUC and thresholds use decision_function instead.
    probability: false
  seed: 42

# Decision-threshold policies (see mspoof.thresholds). The negatives-anchored
# fpr_target policy recovers the extrapolation-regime recall collapse
# (RF 0.867 -> 0.971 at realized FPR ~1%) using NO test labels; the textbook
# val_max_f1 policy makes it WORSE and is kept only as a baseline.
thresholds:
  enabled: true
  val_fraction: 0.25
  target_fprs: [0.01, 0.05]

real_data:
  window_s: 120
  stride_s: 60
  min_epochs: 60
